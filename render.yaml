# Render blueprint - one free Docker web service, SQLite on disk.
#
# Deploy: click the "Deploy to Render" button in the README, or in the Render
# dashboard choose New > Blueprint and point it at this repo - it reads this
# file automatically since it lives at the repo root.
#
# No managed database: Render's free Postgres now expires 30 days after
# creation. SQLite is this app's zero-setup default, so the free tier stays
# free indefinitely - but the free tier's disk is ephemeral: data is wiped on
# every restart, redeploy or wake from sleep (reload the sample logs). Point
# DATABASE_URL at a Neon (or any) Postgres connection string for a store that
# survives restarts - no code change needed.
#
# Render's free web services sleep after 15 minutes of inactivity and take
# roughly 50 seconds to wake on the next request - expected for a free-tier
# portfolio demo, not a bug.

services:
  - type: web
    name: incident-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: SEED_ON_STARTUP
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
